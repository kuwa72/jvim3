name: build

# Every push and pull request builds and runs the 42 encoding tests, so a break
# shows up when it is made rather than at release time. A tag matching v* does
# the same and then publishes the Windows build to the release page, which means
# a broken build can never become a release.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per ref is enough; a tag run is never thrown away.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  unix:
    name: Linux build and encoding tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install the terminal library
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            libncurses-dev
      - name: Build and run the 42 encoding tests
        run: ./scripts/build-unix.sh test

  macos:
    name: macOS build and encoding tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Nothing to install: clang, curses and bash 3.2 all come with the system.
      - name: Build and run the 42 encoding tests
        run: ./scripts/build-unix.sh test

  # The BSDs run in a VM on the Linux runner, the same idea as
  # scripts/test-bsd-docker.sh but with somebody else's prebuilt guest, which
  # boots in a couple of minutes instead of being installed from scratch.
  freebsd:
    name: FreeBSD build and encoding tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash
          run: ./scripts/build-unix.sh test

  netbsd:
    name: NetBSD build and encoding tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: /usr/sbin/pkg_add bash
          run: PATH=$PATH:/usr/pkg/bin ./scripts/build-unix.sh test

  openbsd:
    name: OpenBSD build and encoding tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I bash
          run: ./scripts/build-unix.sh test

  windows:
    name: Windows build (mingw-w64, i686)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Only the 32 bit C cross compiler. The mingw-w64 metapackage drags in
      # both architectures, g++ and gfortran, and installing it took over half
      # an hour on the runner before it was cancelled.
      - name: Install mingw-w64
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            gcc-mingw-w64-i686-win32 binutils-mingw-w64-i686
          i686-w64-mingw32-gcc --version | head -1
      - name: Build the GUI and console executables
        run: ./scripts/build-mingw.sh both
      - name: Package dist/i686
        run: |
          name=jvim3-${GITHUB_REF_NAME:-snapshot}-win32
          cp -r dist/i686 "$name"
          mkdir -p out
          zip -r "out/$name.zip" "$name"
          ls -l out
      - uses: actions/upload-artifact@v5
        with:
          name: win32
          path: out/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [unix, macos, freebsd, netbsd, openbsd, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: win32
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --title "JVim 3 $GITHUB_REF_NAME" \
            --notes "$(cat <<'EOF'
          JVim 3.0-j2.1b with UTF-8 support.

          `jvim3-*-win32.zip` holds the 32 bit Windows build: `jvim32w.exe`
          (GUI), `jvim32.exe` (console), the help file and a sample `_jvimrc`.
          Point `%VIM%` at that directory. It runs on 64 bit Windows under
          WoW64; see BUILDING-mingw.md for why 32 bit is the one to use.

          Build it yourself with `scripts/build-mingw.sh both` for Windows or
          `scripts/build-unix.sh test` on Linux, the BSDs and macOS.
          EOF
          )"
