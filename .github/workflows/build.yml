name: build

# Every push and pull request builds and runs both test suites, so a break
# shows up when it is made rather than at release time. A tag matching v* does
# the same and then publishes the Windows build to the release page, which means
# a broken build can never become a release.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per ref is enough; a tag run is never thrown away.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Cheap, and it fails in seconds while the BSD virtual machines are still
  # booting, which is the right place to lose. It exists because the numbers
  # written in the documentation drifted away from the tree without anybody
  # noticing: two READMEs disagreed about the latest release, the test count
  # appeared as both 100 and 110, and the release notes -- pasted into every
  # release -- claimed the tests passed on macOS after it had been dropped.
  docs:
    name: Docs and version agree with reality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: ./scripts/check-docs.sh
      # On a tag, the number in VERSION is what the binary, the exe properties
      # and the package names all report, so a tag that disagrees with it would
      # publish a release whose contents name a different version. Checked here,
      # where the tag can still be deleted and redone before anything is public.
      - name: The tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          want="v$(tr -d ' \t\r\n' < VERSION)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but VERSION says $want" >&2
            exit 1
          fi

  unix:
    name: Linux build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install the terminal library
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            libncurses-dev
      - name: Build and run both test suites
        run: ./scripts/build-unix.sh test
      # The classes of warning that actually break things: an implicit
      # declaration truncates a returned pointer on 64 bit, a mismatched
      # pointer type means somebody is reading the wrong thing, and a missing
      # prototype means nothing is checked. All of those have bitten this
      # codebase. The 236 char/char_u signedness warnings are another matter
      # and stay warnings; see BUILDING-unix.md.
      - name: The warnings that have to stay away
        run: |
          ./scripts/build-unix.sh clean
          EXTRA_CFLAGS="-Wall -Wno-pointer-sign \
            -Werror=implicit-function-declaration -Werror=implicit-int \
            -Werror=incompatible-pointer-types -Werror=int-conversion \
            -Werror=strict-prototypes -Werror=old-style-definition \
            -Werror=return-type -Werror=uninitialized" ./scripts/build-unix.sh

# No macOS job. It is not a target anybody here can try by hand, so a failure
# there is a puzzle nobody is in a position to solve -- and one duly turned up:
# an escape sequence arriving as the very first thing typed was not recognised,
# which no other system does. The __APPLE__ paths in unix.h and unix.c stay,
# since they are shared with the BSDs, but nothing checks them.

  # The BSDs run in a VM on the Linux runner, the same idea as
  # scripts/test-bsd-docker.sh but with somebody else's prebuilt guest, which
  # boots in a couple of minutes instead of being installed from scratch.
  freebsd:
    name: FreeBSD build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash
          run: ./scripts/build-unix.sh test

  netbsd:
    name: NetBSD build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: /usr/sbin/pkg_add bash
          run: PATH=$PATH:/usr/pkg/bin ./scripts/build-unix.sh test

  openbsd:
    name: OpenBSD build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I bash
          run: ./scripts/build-unix.sh test

  dragonfly:
    name: DragonFly build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash
          run: ./scripts/build-unix.sh test

  windows:
    name: Windows build (mingw-w64, 32 and 64 bit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Only the C cross compilers. The mingw-w64 metapackage drags in both
      # architectures, g++ and gfortran, and installing it took over half an
      # hour on the runner before it was cancelled.
      - name: Install mingw-w64
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            gcc-mingw-w64-i686-win32 binutils-mingw-w64-i686 \
            gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          i686-w64-mingw32-gcc --version | head -1
      # 64 bit compiles clean of pointer truncation now, and this keeps it that
      # way.
      - name: Compile 64 bit, and refuse a truncated pointer
        run: |
          ARCH=x86_64 ./scripts/build-mingw.sh warn 2>&1 | tee /tmp/w64.log | tail -2
          ! grep -qE 'pointer-to-int-cast|int-to-pointer-cast|error:' /tmp/w64.log
      # The same command anybody can run at home.
      # On a tag the packages are named after it, with the leading v dropped, so
      # they read jvim3-1.0.0-win32.zip. Otherwise the script names them after
      # VERSION plus the commit, which is self-describing and needs no tags
      # fetched -- the checkout here is shallow and has none.
      - name: Build and package both architectures
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION=${GITHUB_REF_NAME#v} ./scripts/build-mingw.sh release
          else
            ./scripts/build-mingw.sh release
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [docs, unix, freebsd, netbsd, openbsd, dragonfly, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes name the previous tag and link a comparison
      # against it, which a shallow clone cannot answer.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: windows
          path: release
      # The notes are this tag's section of CHANGELOG.md plus the standing part
      # from .github/release-body.md, which holds no counts or platform names of
      # its own -- those are computed, so they cannot go stale the way the
      # heredoc that used to live here did. --latest is explicit because the
      # default is "by date and version", and this tree's versions restarted at
      # 1.0.0, which sorts below the old v3.0-j2.1b-utf8.* tags.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --latest \
            --title "JVim 3 ${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/notes.md
